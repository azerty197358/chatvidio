name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # مفتاح توقيع ثابت: يُولَّد مرة واحدة فقط ثم يُحفظ داخل المستودع،
      # فتظل كل النسخ موقّعة بالتوقيع نفسه وتُثبَّت فوق القديمة مباشرة
      # (وإلّا ظهرت رسالة "التطبيق غير مثبت" عند كل تحديث).
      - name: Ensure stable signing keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "Keystore already committed - using the stable key."
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "chore: ثبات مفتاح توقيع التطبيق حتى تنجح التحديثات فوق القديم [skip ci]"
            if ! git push origin HEAD:main; then
              echo "Push failed - falling back to the keystore already on main."
              git fetch origin main --depth=1 || true
              git show origin/main:debug.keystore > debug.keystore || true
            fi
          fi
          echo "SHA256:"; sha256sum debug.keystore || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build release AAB (for Google Play)
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zoomdz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zoomdz-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: zoomdz-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish APK to GitHub Release (رابط تحميل ثابت لزر المنصة)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk zoomdz-app.apk
          if gh release view app --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload app zoomdz-app.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create app zoomdz-app.apk \
              --repo "${{ github.repository }}" \
              --title "ZoomDz Android App (APK)" \
              --notes "أحدث نسخة من تطبيق المنصة لأندرويد — تُحدَّث تلقائياً مع كل عملية بناء، والرابط ثابت لزر التحميل في الواجهة."
          fi
          echo "APK published: https://github.com/${{ github.repository }}/releases/download/app/zoomdz-app.apk"
