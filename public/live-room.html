<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>غرفة البث المباشر - ZoomDz</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0b0f19;
            color: #fff;
            height: 100vh;
            /* ✅ الجوال: الارتفاع الديناميكي بعد خضم شريط العنوان — الأزرار السفلية تبقى ظاهرة دائماً */
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .room-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            flex-shrink: 0;
        }
        .room-header .title { font-weight: 700; font-size: 15px; }
        .room-header .status {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #94a3b8;
        }
        .status-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #f59e0b;
            transition: background .3s;
        }
        .status-dot.live { background: #22c55e; }
        .room-header .timer-chip {
            background: #0f172a;
            border: 1px solid #334155;
            color: #38bdf8;
            font-weight: 700;
            font-size: 13px;
            padding: 3px 12px;
            border-radius: 20px;
            direction: ltr;
            white-space: nowrap;
        }
        .room-header .timer-chip.expired { color: #f87171; border-color: #7f1d1d; }
        .room-header .timer-chip.done { color: #4ade80; border-color: #14532d; }
        .video-area {
            flex: 1;
            /* ✅ السماح للشبكة بالانكماش داخل flex — بدونه يدفع المحتوى شريط الأزرار خارج الشاشة على الجوال */
            min-height: 0;
            display: grid;
            gap: 10px;
            padding: 12px;
            overflow: auto;
            grid-template-columns: 1fr;
            grid-auto-rows: min-content;
            position: relative;
        }
        .video-area.has-remotes {
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }
        .video-tile {
            position: relative;
            background: #1f2937;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 4px 18px rgba(0,0,0,.35);
        }
        .video-tile.instructor {
            grid-column: 1 / -1;
            aspect-ratio: 16 / 8;
            border: 2px solid #3b82f6;
        }
        .video-tile video {
            width: 100%; height: 100%;
            object-fit: cover;
            background: #000;
            /* الاتجاه الحقيقي دائماً: الفيديو البعيد لا يُعكس إطلاقاً حتى تُقرأ الكتابة على السبورة صحيحة */
            transform: none;
            transform-origin: center;
        }
        /* بلاطة الأستاذ: غير معكوسة + بدون قصّ (تُعرض كاملة لقراءة السبورة من كل الأطراف) */
        .video-tile.instructor video { transform: none; object-fit: contain; }
        /* معاينة الذات الوحيدة المعكوسة: كاميرا الطالب المحلية (شعور طبيعي كالمرايا) */
        #localTile:not(.instructor) video { transform: scaleX(-1); }
        /* بعد التكبير: مؤشر سحب + تعطيل تمرير الصفحة/القرص المتصفح حتى يُسحب المحتوى المكبّر داخل الإطار */
        .video-tile.zoomed { cursor: grab; touch-action: none; }
        .video-tile.zoomed:active { cursor: grabbing; }
        /* زر ملء الشاشة على البلاطة + دعم الزووم */
        .tile-fs-btn {
            position: absolute;
            top: 8px; left: 10px;
            width: 30px; height: 30px;
            background: rgba(0,0,0,.55);
            color: #fff;
            border: none; border-radius: 8px;
            font-size: 15px; line-height: 1;
            cursor: pointer;
            z-index: 6;
        }
        .tile-fs-btn:hover { background: rgba(0,0,0,.8); }
        .video-tile:fullscreen,
        .video-tile:-webkit-full-screen {
            width: 100vw; height: 100vh;
            border-radius: 0;
            aspect-ratio: auto;
            background: #000;
        }
        .video-tile:fullscreen video,
        .video-tile:-webkit-full-screen video { object-fit: contain; }
        .video-tile .label {
            position: absolute;
            bottom: 8px; right: 10px;
            background: rgba(0,0,0,.6);
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .video-tile .waiting {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 8px; color: #64748b; font-size: 14px;
        }
        .room-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            /* ✅ مساحة أمان أسفل (شريط منزل الآيفون) — الأزرار لا تُقصّ أبداً */
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            background: #111827;
            border-top: 1px solid #1f2937;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 4px;
            min-width: 68px; padding: 10px 12px;
            background: #1f2937;
            color: #fff;
            border: none; border-radius: 14px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 12px; font-weight: 600;
            transition: background .2s, transform .1s;
            position: relative;
        }
        .ctrl-btn:hover { background: #374151; transform: translateY(-1px); }
        .ctrl-btn.off { background: #7f1d1d; }
        .ctrl-btn.active { background: #1d4ed8; }
        .ctrl-btn.leave { background: #b91c1c; }
        .ctrl-btn.leave:hover { background: #dc2626; }
        .ctrl-btn svg { width: 22px; height: 22px; }
        .chat-badge {
            position: absolute; top: -5px; left: -5px;
            background: #ef4444; color: #fff;
            border-radius: 50%;
            min-width: 17px; height: 17px;
            font-size: 10px; font-weight: 800;
            display: none;
            align-items: center; justify-content: center;
            padding: 0 3px;
        }
        .chat-badge.show { display: flex; animation: badgePop .28s ease; }
        @keyframes badgePop {
            0% { transform: scale(.5); }
            70% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
        .ctrl-btn.alert {
            background: #7f1d1d;
            animation: alertPulse 1.4s infinite;
        }
        @keyframes alertPulse {
            0% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
            70% { box-shadow: 0 0 0 9px rgba(239,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }
        .participants-pill {
            position: fixed;
            top: 62px; left: 14px;
            background: rgba(17,24,39,.9);
            border: 1px solid #1f2937;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            z-index: 30;
        }
        /* ===== لوحة الدردشة ===== */
        .chat-panel {
            position: fixed;
            top: 52px; bottom: 0; left: 0;
            width: min(340px, 92vw);
            background: #0f172a;
            border-right: 1px solid #1f2937;
            display: none;
            flex-direction: column;
            z-index: 60;
            box-shadow: 4px 0 20px rgba(0,0,0,.45);
        }
        .chat-panel.open { display: flex; }
        .chat-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #1f2937;
            font-weight: 800; font-size: 0.92rem;
        }
        .chat-head button {
            background: none; border: none; color: #94a3b8;
            font-size: 1.1rem; cursor: pointer;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-empty { color: #64748b; text-align: center; font-size: 0.8rem; margin-top: 20px; }
        .chat-msg {
            background: #1f2937;
            border-radius: 12px;
            padding: 6px 10px 8px;
            font-size: 0.82rem;
            max-width: 88%;
            align-self: flex-start;
            word-break: break-word;
        }
        .chat-msg.mine { align-self: flex-end; background: #1d4ed8; }
        .chat-msg.from-teacher { background: #3730a3; }
        .chat-msg .msg-meta {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.66rem; color: #93c5fd;
            margin-bottom: 2px;
        }
        .chat-msg.mine .msg-meta { color: #bfdbfe; }
        .chat-msg .who { font-weight: 700; }
        .chat-msg .role-chip {
            font-size: 0.58rem;
            padding: 0 6px;
            border-radius: 20px;
            font-weight: 700;
            line-height: 1.5;
        }
        .chat-msg .role-chip.teacher { background: #fbbf24; color: #1f2937; }
        .chat-msg .role-chip.student { background: rgba(255,255,255,.15); color: #e5e7eb; }
        .chat-msg .muted-tag { color: #fca5a5; font-weight: 700; }
        .chat-msg .mute-btn {
            background: none; border: none;
            color: #fbbf24; cursor: pointer;
            font-size: 0.8rem; padding: 0;
        }
        .chat-mute-hint {
            padding: 8px 12px;
            background: #451a03;
            color: #fbbf24;
            font-size: 0.75rem; font-weight: 700;
            text-align: center;
            display: none;
        }
        .chat-input-row {
            display: flex; gap: 6px;
            padding: 8px;
            /* ✅ حقل الكتابة يبقى فوق شريط منزل الجوال */
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid #1f2937;
        }
        .chat-input-row input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 10px;
            padding: 9px 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.82rem;
        }
        .chat-input-row input:disabled { opacity: 0.45; }
        .chat-input-row button {
            background: #2563eb; color: #fff;
            border: none; border-radius: 10px;
            padding: 9px 14px;
            font-family: 'Cairo', sans-serif;
            font-weight: 800; font-size: 0.82rem;
            cursor: pointer;
        }
        .chat-input-row button:disabled { opacity: 0.45; cursor: default; }
        /* ===== انتهاء البث ===== */
        .stream-ended-overlay {
            position: absolute; inset: 0;
            display: none;
            align-items: center; justify-content: center;
            background: rgba(2,6,23,.85);
            color: #f87171;
            font-weight: 800; font-size: 1.05rem;
            z-index: 40;
            text-align: center; padding: 20px;
        }
        .stream-ended-overlay.show { display: flex; }
        /* ===== الجوال: شاشة بث أكبر + عناصر تحكم مضغوطة ===== */
        @media (max-width: 640px) {
            .video-area.has-remotes { grid-template-columns: 1fr; }
            .ctrl-btn { min-width: 56px; padding: 7px 8px; font-size: 11px; flex: 0 0 auto; }
            .ctrl-btn svg { width: 19px; height: 19px; }
            .room-header { padding: 7px 12px; }
            .room-header .title { font-size: 13px; }
            /* ✅ شريط الأزرار لا ينضغط ولا يخرج عن الشاشة — صف واحد يتمرّر أفقياً عند الحاجة */
            .room-controls {
                padding: 8px;
                padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
                gap: 8px;
                flex-wrap: nowrap;
                overflow-x: auto;
                justify-content: flex-start;
                scrollbar-width: none;
                -webkit-overflow-scrolling: touch;
            }
            .room-controls::-webkit-scrollbar { display: none; }
            .video-area { padding: 6px; gap: 6px; }
            .participants-pill { top: 48px; left: 8px; padding: 4px 10px; font-size: 11px; }
            /* بلاطة الأستاذ أكبر بوضوح: تملأ معظم الشاشة الرأسية بدون أي قصّ
               ✅ dvh = الارتفاع الحقيقي بعد خصم شريط عنوان المتصفح (fallback للمتصفحات القديمة) */
            .video-tile.instructor { aspect-ratio: auto; height: clamp(230px, 48vh, 520px); height: clamp(230px, 48dvh, 520px); }
            .video-area.has-remotes .video-tile:not(.instructor) { aspect-ratio: 16 / 9; }
        }
        /* ===== الوضع الأفقي: الفيديو يملأ الشاشة (مثالي للدراسة) ===== */
        @media (orientation: landscape) and (max-height: 560px) {
            .room-header { padding: 4px 12px; }
            .room-header .title { font-size: 12px; }
            .room-header .status { font-size: 11px; gap: 6px; }
            .room-header .timer-chip { font-size: 11px; padding: 2px 10px; }
            .participants-pill { top: 34px; left: 8px; padding: 3px 10px; font-size: 11px; }
            .video-area { padding: 4px; gap: 6px; }
            /* البث يملأ الشاشة بأكملها تقريباً عند وضع الجوال أفقياً (مع فارق آمن لشريط التحكم)
               ✅ dvh — ارتفاع ديناميكي بعد خصم شريط عنوان المتصفح */
            .video-tile.instructor { aspect-ratio: auto; height: calc(100vh - 96px); height: calc(100dvh - 96px); }
            /* عند وجود بلاطات أخرى يُصغّر بث الأستاذ حتى تظهر جميعاً دون تمرير */
            .video-area.multi-tiles .video-tile.instructor { height: 46vh; height: 46dvh; }
            .room-controls { padding: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
            .ctrl-btn { min-width: 52px; padding: 5px 7px; font-size: 10px; gap: 2px; }
            .ctrl-btn svg { width: 17px; height: 17px; }
            .chat-panel { top: 28px; width: min(320px, 56vw); }
        }
    </style>
</head>
<body>
    <div class="room-header">
        <div class="title" id="roomTitle">غرفة البث المباشر</div>
        <div class="timer-chip" id="timerChip" style="display:none;">⏱ --:--</div>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">جاري الاتصال...</span>
        </div>
    </div>

    <div class="participants-pill" id="participantsPill">المشاركون: 1</div>

    <div class="video-area" id="videoArea">
        <div class="video-tile instructor" id="localTile" style="display:none;">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="label" id="localLabel">أنت</div>
        </div>
        <div class="video-tile" id="viewerPlaceholder" style="display:none;">
            <div class="waiting">🎥<br>بانتظار انطلاق البث من الأستاذ...</div>
        </div>
        <div class="stream-ended-overlay" id="streamEndedOverlay">انتهى البث المباشر</div>
    </div>

    <div class="room-controls">
        <button class="ctrl-btn" id="btnMic" title="الميكروفون" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            <span>الميكروفون</span>
        </button>
        <button class="ctrl-btn" id="btnCam" title="الكاميرا" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            <span>الكاميرا</span>
        </button>
        <button class="ctrl-btn" id="btnScreen" title="مشاركة الشاشة" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span>مشاركة الشاشة</span>
        </button>
        <button class="ctrl-btn" id="btnChat" title="الدردشة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>الدردشة</span>
            <span class="chat-badge" id="chatBadge">0</span>
        </button>
        <button class="ctrl-btn leave" id="btnLeave" title="مغادرة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>مغادرة</span>
        </button>
    </div>

    <!-- ===== لوحة الدردشة ===== -->
    <div class="chat-panel" id="chatPanel">
        <div class="chat-head">
            <span id="chatTitle">💬 الدردشة المباشرة</span>
            <button id="chatClose" title="إغلاق">&times;</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-empty" id="chatEmpty">لا توجد رسائل بعد — كن أول من يرسل رسالة!</div>
        </div>
        <div class="chat-mute-hint" id="chatMuteHint">تمكتمك من قبل الأستاذ في هذه الحصة — لا يمكنك إرسال رسائل</div>
        <div class="chat-input-row" id="chatInputRow" style="display:none;">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." maxlength="500" autocomplete="off">
            <button id="chatSend">إرسال</button>
        </div>
    </div>

    <script src="/js/webrtc.js"></script>
    <script>
    (function () {
        'use strict';

        var params = new URLSearchParams(window.location.search);
        var roomId = params.get('room') || '';
        var role = params.get('role') === 'teacher' ? 'teacher' : 'student';

        if (!roomId) {
            window.location.href = role === 'teacher' ? '/teacher-dashboard.html' : '/student-dashboard.html';
            return;
        }

        var token = localStorage.getItem('token') || params.get('token') || '';
        var userId = role + '_' + Math.random().toString(36).slice(2, 9);
        var localStream = null;
        var connected = false;

        //  معرّف الدرس (غرفة WebRTC باسم offer_<id>) + هوية المستخدم من التوكن
        var offerId = null;
        var mOffer = /^offer_(\d+)$/.exec(roomId);
        if (mOffer) offerId = parseInt(mOffer[1], 10);

        var myUserId = null;
        try {
            var jwtPayload = JSON.parse(atob((token || '').split('.')[1] || ''));
            myUserId = jwtPayload ? jwtPayload.userId : null;
        } catch (e) {}
        var canChat = !!token && myUserId !== -1 && myUserId !== '-1';

        var localVideo = document.getElementById('localVideo');
        var localLabel = document.getElementById('localLabel');
        var localTile = document.getElementById('localTile');
        var viewerPlaceholder = document.getElementById('viewerPlaceholder');
        var videoArea = document.getElementById('videoArea');
        var statusDot = document.getElementById('statusDot');
        var statusText = document.getElementById('statusText');
        var participantsPill = document.getElementById('participantsPill');
        var roomTitle = document.getElementById('roomTitle');
        var streamEndedOverlay = document.getElementById('streamEndedOverlay');

        var chatPanel = document.getElementById('chatPanel');
        var chatMessages = document.getElementById('chatMessages');
        var chatEmpty = document.getElementById('chatEmpty');
        var chatInput = document.getElementById('chatInput');
        var chatSendBtn = document.getElementById('chatSend');
        var chatInputRow = document.getElementById('chatInputRow');
        var chatMuteHint = document.getElementById('chatMuteHint');
        var chatBadge = document.getElementById('chatBadge');
        var btnChatEl = document.getElementById('btnChat');

        roomTitle.textContent = role === 'teacher' ? 'غرفة البث (الأستاذ)' : 'غرفة البث (مشاهد)';

        function setStatus(text, live) {
            statusText.textContent = text;
            statusDot.className = 'status-dot' + (live ? ' live' : '');
        }

        // ===== عدّاد المشاركين (من إشارات WebSocket — بدون أي طلبات إضافية) =====
        var participantIds = {};
        function updatePill() {
            var n = Object.keys(participantIds).length;
            participantsPill.textContent = 'المشاركون: ' + n;
        }
        function addParticipant(id) { participantIds[id] = 1; updatePill(); }
        function removeParticipant(id) { delete participantIds[id]; updatePill(); }

        //  عنصر فيديو عن بعيد
        var remoteTiles = {};

        // ===== تكبير الفيديو: ملء الشاشة + زووم بالقرص (Pinch) والنقر المزدوج =====
        function toggleTileFullscreen(tile, vid) {
            try {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    return;
                }
                if (tile.requestFullscreen) {
                    tile.requestFullscreen().catch(function () {});
                } else if (tile.webkitRequestFullscreen) {
                    tile.webkitRequestFullscreen();
                } else if (vid.webkitEnterFullscreen) {
                    vid.webkitEnterFullscreen(); // iOS Safari
                }
            } catch (e) {}
        }

        function setupTileZoom(tile, vid) {
            var zoom = 1, panX = 0, panY = 0;
            // يُعكس فقط الذات (بلاطة الطالب المحلية) — الفيديو البعيد يبقى بالاتجاه الحقيقي دائماً
            var mirrored = (tile.id === 'localTile' && !tile.classList.contains('instructor'));
            var lastTap = 0, suppressTapUntil = 0;

            // الإبقاء على المحتوى المكبّر داخل حدود البلاطة (لا يمكن سحبه خارج الإطار)
            function clampPan() {
                var r = tile.getBoundingClientRect();
                var maxX = (r.width * (zoom - 1)) / 2;
                var maxY = (r.height * (zoom - 1)) / 2;
                panX = Math.max(-maxX, Math.min(maxX, panX));
                panY = Math.max(-maxY, Math.min(maxY, panY));
            }
            function apply() {
                if (zoom <= 1) { zoom = 1; panX = 0; panY = 0; }
                else clampPan();
                // panX باتجاه حركة الإصبع بصرياً — طبقة المرآة (scaleX(-1)) تعكس الاتجاه عند التطبيق
                var tx = mirrored ? -panX : panX;
                vid.style.transform =
                    (mirrored ? 'scaleX(-1) ' : '') +
                    ((zoom !== 1 || panX !== 0 || panY !== 0)
                        ? 'translate(' + tx.toFixed(1) + 'px,' + panY.toFixed(1) + 'px) ' + (zoom !== 1 ? 'scale(' + zoom.toFixed(3) + ')' : '')
                        : '');
                tile.classList.toggle('zoomed', zoom > 1);
            }
            function touchDist(t) {
                var dx = t[0].clientX - t[1].clientX;
                var dy = t[0].clientY - t[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }
            var startDist = 0, startZoom = 1;
            // سحب بإصبع واحد بعد التكبير: تحريك ما تم تكبيره داخل الإطار
            var panning = false, lastX = 0, lastY = 0, dragMoved = 0;
            tile.addEventListener('touchstart', function (e) {
                if (e.touches.length === 2) {
                    panning = false;
                    startDist = touchDist(e.touches);
                    startZoom = zoom;
                } else if (e.touches.length === 1 && zoom > 1) {
                    panning = true;
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                    dragMoved = 0;
                }
            }, { passive: true });
            tile.addEventListener('touchmove', function (e) {
                if (e.touches.length === 2 && startDist > 0) {
                    e.preventDefault(); // منع تكبير الصفحة — الزووم على الفيديو فقط
                    var z = startZoom * (touchDist(e.touches) / startDist);
                    zoom = Math.min(4, Math.max(1, z));
                    apply();
                } else if (e.touches.length === 1 && panning && zoom > 1) {
                    e.preventDefault(); // منع تمرير الصفحة — نحرك الفيديو المكبّر فقط
                    var dx = e.touches[0].clientX - lastX;
                    var dy = e.touches[0].clientY - lastY;
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                    panX += dx;
                    panY += dy;
                    dragMoved += Math.abs(dx) + Math.abs(dy);
                    apply();
                }
            }, { passive: false });
            tile.addEventListener('touchend', function (e) {
                if (e.touches.length < 2) startDist = 0;
                if (e.touches.length === 0) {
                    // بعد سحب حقيقي: تجاهل النقرة التالية حتى لا تُ interpreted كنقر مزدوج وتقلب الزووم
                    if (panning && dragMoved > 10) suppressTapUntil = Date.now() + 400;
                    panning = false;
                }
            });
            // سحب بالفأرة بعد التكبير (سطح المكتب)
            var mouseDown = false, mouseX = 0, mouseY = 0;
            tile.addEventListener('mousedown', function (e) {
                if (e.target.closest && e.target.closest('.tile-fs-btn')) return;
                if (zoom <= 1) return;
                mouseDown = true;
                dragMoved = 0;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            window.addEventListener('mousemove', function (e) {
                if (!mouseDown) return;
                var dx = e.clientX - mouseX, dy = e.clientY - mouseY;
                mouseX = e.clientX; mouseY = e.clientY;
                panX += dx;
                panY += dy;
                dragMoved += Math.abs(dx) + Math.abs(dy);
                apply();
            });
            window.addEventListener('mouseup', function () {
                if (!mouseDown) return;
                mouseDown = false;
                if (dragMoved > 6) suppressTapUntil = Date.now() + 400;
            });
            tile.addEventListener('click', function () {
                if (Date.now() < suppressTapUntil) return; // نقرة ناتجة عن سحب — تُتجاهل
                var now = Date.now();
                if (now - lastTap < 320) {
                    zoom = (zoom > 1) ? 1 : 2.5; // نقرة مزدوجة: تكبير متمركز أو عودة للعرض الكامل
                    panX = 0; panY = 0;
                    apply();
                }
                lastTap = now;
            });
        }

        //  تحديث تخطيط البلاطات: هل هناك أكثر من مصدر فيديو واحد؟ (يُصغّر بث الأستاذ في الوضع الأفقي)
        function refreshTileLayout() {
            var shownLocal = localTile && localTile.style.display !== 'none';
            var total = Object.keys(remoteTiles).length + (shownLocal ? 1 : 0);
            videoArea.classList.toggle('multi-tiles', total > 1);
        }

        function addRemoteTile(userId, label) {
            if (remoteTiles[userId]) return remoteTiles[userId];
            var tile = document.createElement('div');
            tile.className = 'video-tile' + (role === 'student' && label === 'الأستاذ' ? ' instructor' : '');
            var vid = document.createElement('video');
            vid.autoplay = true; vid.playsInline = true;
            var lab = document.createElement('div');
            lab.className = 'label';
            lab.textContent = label || userId;
            var fsBtn = document.createElement('button');
            fsBtn.className = 'tile-fs-btn';
            fsBtn.type = 'button';
            fsBtn.title = 'ملء الشاشة (نقرة مزدوجة على الفيديو للتكبير)';
            fsBtn.textContent = '⛶';
            fsBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleTileFullscreen(tile, vid);
            });
            tile.appendChild(vid);
            tile.appendChild(lab);
            tile.appendChild(fsBtn);
            setupTileZoom(tile, vid);
            videoArea.appendChild(tile);
            videoArea.classList.add('has-remotes');
            remoteTiles[userId] = { tile: tile, video: vid };
            updateViewerPlaceholder();
            refreshTileLayout();
            return remoteTiles[userId];
        }

        function removeRemoteTile(userId) {
            var t = remoteTiles[userId];
            if (t) {
                t.tile.remove();
                delete remoteTiles[userId];
            }
            if (Object.keys(remoteTiles).length === 0) {
                videoArea.classList.remove('has-remotes');
            }
            updateViewerPlaceholder();
            refreshTileLayout();
        }

        function updateViewerPlaceholder() {
            //  الطالب مشاهد فقط: تظهر شاشة الانتظار ما لم يصل فيديو الأستاذ
            if (role === 'student') {
                viewerPlaceholder.style.display = (Object.keys(remoteTiles).length === 0 && !streamEnded) ? '' : 'none';
            }
        }

        //  أحداث مكتبة WebRTC
        ZoomyRTC.onRemoteStream(function (userId, stream) {
            var entry = addRemoteTile(userId, userId.indexOf('teacher_') === 0 ? 'الأستاذ' : 'طالب');
            entry.video.srcObject = stream;
        });

        ZoomyRTC.onParticipantJoined(function (pUserId) {
            setStatus('متصل', true);
            addParticipant(pUserId);
        });

        ZoomyRTC.onParticipantLeft(function (pUserId) {
            removeRemoteTile(pUserId);
            removeParticipant(pUserId);
        });

        ZoomyRTC.onConnectionState(function (state) {
            if (state === 'connected') {
                connected = true;
                setStatus('متصل', true);
            } else if (state === 'disconnected') {
                setStatus('جاري إعادة الاتصال...', false);
            }
        });

        // ===== الدردشة المباشرة (REST + بث فوري عبر الإشارات) =====
        var chatLog = [];
        var seenMsgIds = {};
        var mutedStudents = [];
        var iAmMuted = false;
        var streamEnded = false;
        var unreadCount = 0;
        var chatPanelOpen = false;

        function escText(s) {
            var d = document.createElement('div');
            d.textContent = (s == null ? '' : String(s));
            return d.innerHTML;
        }

        function normalizeMsg(raw) {
            if (!raw) return null;
            return {
                id: raw.id != null ? raw.id : (raw.msgId != null ? raw.msgId : null),
                text: raw.text != null ? raw.text : raw.message,
                sender: raw.sender != null ? raw.sender : raw.sender_name,
                senderId: raw.senderId != null ? raw.senderId : raw.sender_id,
                senderRole: raw.senderRole != null ? raw.senderRole : raw.sender_role
            };
        }

        function ingestMessage(raw, skipRender) {
            var msg = normalizeMsg(raw);
            if (!msg || !msg.text) return;
            var key = msg.id != null ? 'id_' + msg.id : ('txt_' + (msg.sender || '') + '_' + msg.text + '_' + chatLog.length);
            if (seenMsgIds[key]) return;
            seenMsgIds[key] = 1;
            chatLog.push(msg);
            if (chatLog.length > 200) {
                chatLog.shift();
            }
            updateChatTitleFromTeacher(msg);
            if (!skipRender) renderChat();
            if (!chatPanelOpen) {
                unreadCount++;
                updateChatBadge();
            }
        }

        //  إظهار اسم الأستاذ الحقيقي في عنوان الدردشة للطالب
        var chatTitleEl = document.getElementById('chatTitle');
        function updateChatTitleFromTeacher(msg) {
            if (role !== 'student' || !msg) return;
            if (msg.senderRole !== 'teacher') return;
            var n = String(msg.sender || '').trim();
            if (!n || n === 'الأستاذ') return;
            chatTitleEl.textContent = '💬 الدردشة مع الأستاذ: ' + n;
            // ✅ إظهار اسم الأستاذ الحقيقي على بلاطة الفيديو أيضاً
            var lab = document.querySelector('.video-tile.instructor .label');
            if (lab) lab.textContent = n;
        }

        function updateChatBadge() {
            if (unreadCount > 0) {
                chatBadge.textContent = unreadCount > 99 ? '99+' : String(unreadCount);
                chatBadge.classList.add('show');
                btnChatEl.classList.add('alert'); // وميض يجذب الانتظار لوجود رسائل جديدة
            } else {
                chatBadge.classList.remove('show');
                btnChatEl.classList.remove('alert');
            }
        }

        function isMutedStudent(id) {
            if (id == null) return false;
            for (var i = 0; i < mutedStudents.length; i++) {
                if (String(mutedStudents[i]) === String(id)) return true;
            }
            return false;
        }

        function renderChat() {
            chatMessages.innerHTML = '';
            if (chatLog.length === 0) {
                chatMessages.appendChild(chatEmpty);
                return;
            }
            chatLog.forEach(function (msg) {
                var isMine = (msg.senderId != null && myUserId != null && String(msg.senderId) === String(myUserId));
                var isTeacherSender = msg.senderRole === 'teacher';
                var el = document.createElement('div');
                el.className = 'chat-msg' + (isMine ? ' mine' : '') + (isTeacherSender ? ' from-teacher' : '');

                var meta = document.createElement('div');
                meta.className = 'msg-meta';
                var who = document.createElement('span');
                who.className = 'who';
                var senderName = String(msg.sender || '').trim();
                who.textContent = (isMine ? 'أنت' : (senderName || (isTeacherSender ? 'الأستاذ' : 'طالب')));
                meta.appendChild(who);
                // شارة الدور بجانب الاسم (أستاذ / طالب)
                var roleChip = document.createElement('span');
                roleChip.className = 'role-chip' + (isTeacherSender ? ' teacher' : ' student');
                roleChip.textContent = isTeacherSender ? 'أستاذ' : 'طالب';
                meta.appendChild(roleChip);

                if (role === 'teacher' && !isTeacherSender && msg.senderId != null) {
                    var muted = isMutedStudent(msg.senderId);
                    var mb = document.createElement('button');
                    mb.className = 'mute-btn';
                    mb.type = 'button';
                    mb.title = muted ? 'فك الكتم' : 'كتم الطالب';
                    mb.textContent = muted ? '📢 فك الكتم' : '🔇 كتم';
                    mb.addEventListener('click', function () { toggleMuteStudent(msg.senderId); });
                    meta.appendChild(mb);
                    if (muted) {
                        var tag = document.createElement('span');
                        tag.className = 'muted-tag';
                        tag.textContent = 'مكتوم';
                        meta.appendChild(tag);
                    }
                } else if (role === 'student' && isMutedStudent(msg.senderId)) {
                    var tag2 = document.createElement('span');
                    tag2.className = 'muted-tag';
                    tag2.textContent = 'مكتوم';
                    meta.appendChild(tag2);
                }

                var body = document.createElement('div');
                body.textContent = String(msg.text);

                el.appendChild(meta);
                el.appendChild(body);
                chatMessages.appendChild(el);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function updateMuteHint() {
            var muted = (role === 'student' && iAmMuted);
            chatMuteHint.style.display = muted ? 'block' : 'none';
            chatInput.disabled = muted || streamEnded;
            chatSendBtn.disabled = muted || streamEnded;
            chatInput.placeholder = streamEnded ? 'انتهى البث المباشر'
                : (muted ? 'تمكتمك من قبل الأستاذ' : 'اكتب رسالتك هنا...');
        }

        function markStreamEnded() {
            if (streamEnded) return;
            streamEnded = true;
            streamEndedOverlay.classList.add('show');
            updateViewerPlaceholder();
            setStatus('انتهى البث', false);
            if (timerAnchorRemaining === null) {
                timerAnchorRemaining = 0;
                timerAnchorAt = Date.now();
            }
            renderTimer();
            updateMuteHint();
        }

        function api(url, options) {
            options = options || {};
            options.headers = Object.assign(
                { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                options.headers || {}
            );
            options.credentials = 'include';
            return fetch(url, options).then(function (res) {
                if (res.status === 401) {
                    console.warn('[LiveRoom] 401 Unauthorized');
                    throw new Error('unauthorized');
                }
                return res.json();
            });
        }

        // ===== موقت البث التنازلي (يظهر للأستاذ والطالب) =====
        var timerChip = document.getElementById('timerChip');
        var timerTotal = 3600;
        var timerAnchorRemaining = null; // آخر قيمة محفوظة من الخادم
        var timerAnchorAt = 0;           // لحظة حفظها
        var timerFrozen = false;         // البث متوقف مؤقتاً

        function fmtTimer(s) {
            s = Math.max(0, Math.round(s));
            var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
            var mm = (m < 10 ? '0' : '') + m, ss = (sec < 10 ? '0' : '') + sec;
            return h > 0 ? (h + ':' + mm + ':' + ss) : (mm + ':' + ss);
        }

        function currentRemaining() {
            if (timerAnchorRemaining === null) return null;
            if (timerFrozen || streamEnded) return Math.max(0, timerAnchorRemaining);
            return Math.max(0, timerAnchorRemaining - (Date.now() - timerAnchorAt) / 1000);
        }

        function syncTimerFrom(data) {
            if (data && data.total_seconds != null && !isNaN(Number(data.total_seconds)) && Number(data.total_seconds) > 0) {
                timerTotal = Number(data.total_seconds);
            }
            if (data && data.remaining_seconds != null && !isNaN(Number(data.remaining_seconds))) {
                timerAnchorRemaining = Math.max(0, Number(data.remaining_seconds));
                timerAnchorAt = Date.now();
            } else if (timerAnchorRemaining === null) {
                // لا توجد قيمة محفوظة بعد — نبدأ من المدة الكاملة للحصة
                timerAnchorRemaining = timerTotal;
                timerAnchorAt = Date.now();
            }
            timerFrozen = !!(data && data.stream_status === 'paused');
            renderTimer();
        }

        function renderTimer() {
            var rem = currentRemaining();
            if (rem === null) { timerChip.style.display = 'none'; return; }
            timerChip.style.display = 'inline-block';
            timerChip.classList.remove('expired', 'done');
            if (streamEnded) {
                timerChip.textContent = '⏱ انتهى وقت الحصة';
                timerChip.classList.add('done');
                return;
            }
            var pct = timerTotal > 0 ? Math.min(100, Math.floor(((timerTotal - rem) / timerTotal) * 100)) : 0;
            timerChip.textContent = '⏱ ' + fmtTimer(rem) + ' (' + pct + '%)';
            if (rem <= 0) timerChip.classList.add('expired');
        }

        // ✅ مزامنة الوقت المتبقي مع الخادم (الأستاذ فقط) — يضمن دقة حساب نسبة الإكتمال والاسترداد عند الإنهاء
        function syncTimerToServer() {
            if (role !== 'teacher' || !offerId || streamEnded) return;
            var rem = currentRemaining();
            if (rem === null) return;
            api('/api/stream/sync-timer/' + offerId, {
                method: 'POST',
                body: JSON.stringify({ remaining_seconds: Math.round(rem), is_paused: false })
            }).then(function (data) {
                // ✅ القيمة المعتمدة هي قيمة الخادم المحسوبة — نثبّتها فوراً (مزامنة لحظية مع الطلاب)
                if (data && data.success) syncTimerFrom(data);
            }).catch(function () {});
        }

        // نبض ثانية واحدة لتحديث العرض (يتوقف تلقائياً عند إخفاء التبويب)
        setInterval(function () {
            if (!document.hidden) renderTimer();
        }, 1000);

        //  جلب الحالة والرسائل + تحديث التواجد (استطلاع كل 15 ثانية — يتوقف عند إخفاء التبويب)
        function refreshChatState() {
            if (!offerId || !token) return Promise.resolve();
            return api('/api/stream/chat/messages/' + offerId).then(function (data) {
                if (!data) return;
                syncTimerFrom(data);
                if (data.stream_ended) { markStreamEnded(); return; }
                if (Array.isArray(data.messages)) {
                    data.messages.forEach(function (m) { ingestMessage(m, true); });
                    renderChat();
                }
                if (Array.isArray(data.muted_students)) {
                    mutedStudents = data.muted_students;
                    if (role === 'student' && myUserId != null) {
                        iAmMuted = data.is_muted === true;
                    }
                    renderChat();
                    updateMuteHint();
                }
            }).catch(function (e) {
                console.warn('[LiveRoom] chat refresh failed');
            });
        }

        var pollTimer = null;
        function startPolling() {
            stopPolling();
            pollTimer = setInterval(function () {
                if (!document.hidden) {
                    refreshChatState();
                    syncTimerToServer();
                }
            }, 15000);
        }
        function stopPolling() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                stopPolling();
            } else {
                renderTimer();
                refreshChatState();
                syncTimerToServer();
                startPolling();
            }
        });

        // ✅ اسم المستخدم المحلي — يُرسل احتياطياً لضمان ظهور الاسم الصحيح في الدردشة
        // حتى لو تعذر جلبه من قاعدة البيانات (الأولوية تبقى لقاعدة البيانات على الخادم)
        function getMyDisplayName() {
            try {
                var u = JSON.parse(localStorage.getItem('userData') || 'null');
                if (u && typeof u === 'object') {
                    var n = u.full_name || u.fullname || u.name || u.username || u.display_name || '';
                    if (typeof n === 'string') {
                        n = n.replace(/[\u0000-\u001F\u007F<>]/g, '').trim().slice(0, 40);
                        if (n && n !== 'undefined' && n !== 'null' && n !== 'طالب' && n !== 'الأستاذ') return n;
                    }
                }
            } catch (e) {}
            return '';
        }

        function sendChatMessage() {
            var text = chatInput.value.trim();
            if (!text || streamEnded || !offerId || !canChat) return;
            if (role === 'student' && iAmMuted) return;
            chatInput.value = '';
            api('/api/stream/chat/send', {
                method: 'POST',
                body: JSON.stringify({ offer_id: offerId, message: text, sender_name: getMyDisplayName() })
            }).then(function (data) {
                if (data && data.success && data.message) {
                    ingestMessage({
                        id: data.message.id,
                        text: data.message.message,
                        sender: data.message.sender_name,
                        senderId: data.message.sender_id,
                        senderRole: data.message.sender_role
                    });
                } else if (data && data.success === false) {
                    //  مثال: كتم أثناء الكتابة — تحديث الحالة بصمت بدون أي رسالة خطأ
                    if (data.error && String(data.error).indexOf('كتم') !== -1) {
                        iAmMuted = true;
                        updateMuteHint();
                    }
                }
            }).catch(function (e) {
                console.warn('[LiveRoom] send failed');
            });
        }

        function toggleMuteStudent(studentId) {
            if (role !== 'teacher' || !offerId || studentId == null) return;
            var mutedNow = isMutedStudent(studentId);
            api('/api/stream/chat/mute', {
                method: 'POST',
                body: JSON.stringify({ offer_id: offerId, student_id: studentId, mute: !mutedNow })
            }).then(function (data) {
                if (data && data.success) {
                    mutedStudents = data.muted_students || [];
                    renderChat();
                }
            }).catch(function (e) {
                console.warn('[LiveRoom] mute failed');
            });
        }

        //  استقبال رسائل الدردشة والأحداث الإدارية عبر بث الخادم (فوري — بدون استطلاع)
        ZoomyRTC.onChatMessage(function (msg) {
            ingestMessage(msg);
        });

        ZoomyRTC.onModeration(function (msg) {
            var target = msg.target;
            var idx = -1;
            for (var i = 0; i < mutedStudents.length; i++) {
                if (String(mutedStudents[i]) === String(target)) { idx = i; break; }
            }
            if (msg.muted) {
                if (idx === -1) mutedStudents.push(target);
            } else if (idx !== -1) {
                mutedStudents.splice(idx, 1);
            }
            if (role === 'student' && myUserId != null && String(target) === String(myUserId)) {
                iAmMuted = !!msg.muted;
                updateMuteHint();
            }
            renderChat();
        });

        // ===== أزرار الدردشة =====
        function openChatPanel() {
            chatPanelOpen = true;
            chatPanel.classList.add('open');
            unreadCount = 0;
            updateChatBadge();
            refreshChatState();
            if (chatInputRow.style.display !== 'none' && !chatInput.disabled) chatInput.focus();
        }
        function closeChatPanel() {
            chatPanelOpen = false;
            chatPanel.classList.remove('open');
        }

        document.getElementById('btnChat').addEventListener('click', function () {
            if (chatPanelOpen) closeChatPanel(); else openChatPanel();
        });
        document.getElementById('chatClose').addEventListener('click', closeChatPanel);
        chatSendBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendChatMessage();
        });

        //  إظهار/إخفاء عناصر الدور
        if (role === 'teacher') {
            document.getElementById('btnMic').style.display = '';
            document.getElementById('btnCam').style.display = '';
            document.getElementById('btnScreen').style.display = '';
            localTile.style.display = '';
            refreshTileLayout();
        } else {
            updateViewerPlaceholder();
        }

        //  الدردشة متاحة فقط للمسجلين (الزائر يشاهد فقط)
        if (canChat) {
            chatInputRow.style.display = '';
            chatSendBtn.disabled = false;
        } else {
            chatInputRow.style.display = 'none';
            chatMuteHint.style.display = 'none';
        }
        updateMuteHint();

        // ===== عرض الفيديو المحلي (الأستاذ فقط) =====
        function attachLocalStream(stream) {
            localStream = stream;
            localVideo.srcObject = stream;
            localVideo.muted = true;
            var p = localVideo.play();
            if (p && p.catch) p.catch(function () {});

            var vTrack = stream.getVideoTracks()[0];
            localLabel.textContent = 'أنت (الأستاذ)';

            //  إن لم يصل فيديو خلال 3 ثوانٍ (أو مسار ميّت) → إعادة طلب الكاميرا تلقائياً
            if (!vTrack || vTrack.readyState !== 'live') {
                setTimeout(retryVideo, 1500);
            } else {
                setTimeout(function () {
                    if (localVideo.videoWidth === 0) retryVideo();
                }, 3000);
            }
        }

        var videoRetries = 0;
        function retryVideo() {
            if (videoRetries >= 5) return;
            videoRetries++;
            ZoomyRTC.ensureVideo().then(function (track) {
                if (track) {
                    attachLocalStream(ZoomyRTC.getLocalStream());
                } else {
                    setTimeout(retryVideo, 2500);
                }
            });
        }

        // ===== الاتصال بالغرفة =====
        if (role === 'teacher') {
            //  الأستاذ فقط يفتح الكاميرا والميكروفون ثم يتصل
            ZoomyRTC.startMedia().then(function (stream) {
                attachLocalStream(stream);
                return ZoomyRTC.connect(roomId, userId, role, token);
            }).then(function () {
                connected = true;
                setStatus('متصل', true);
                refreshChatState();
                startPolling();
                setTimeout(function () {
                    if (localVideo.videoWidth === 0) retryVideo();
                }, 2000);
            }).catch(function () {
                //  لا رسائل أخطاء إطلاقاً — حالة هادئة فقط + محاولة استعادة الكاميرا
                setStatus('بانتظار السماح بالوصول...', false);
                ZoomyRTC.connect(roomId, userId, role, token).then(function () {
                    refreshChatState();
                    startPolling();
                }).catch(function () {});
                setTimeout(retryVideo, 1500);
            });
        } else {
            //  الطالب مشاهد فقط — بدون كاميرا أو ميكروفون إطلاقاً
            ZoomyRTC.connect(roomId, userId, role, token).then(function () {
                connected = true;
                setStatus('متصل', true);
                refreshChatState();
                startPolling();
            }).catch(function () {
                setStatus('جاري إعادة الاتصال...', false);
            });
        }

        //  أزرار التحكم (الأستاذ فقط — ظاهرة بالفعل عند الدور المناسب)
        document.getElementById('btnMic').addEventListener('click', function () {
            var s = ZoomyRTC.getLocalStream();
            if (s) {
                var a = s.getAudioTracks()[0];
                if (a) {
                    a.enabled = !a.enabled;
                    this.classList.toggle('off', !a.enabled);
                }
            }
        });

        document.getElementById('btnCam').addEventListener('click', function () {
            var s = ZoomyRTC.getLocalStream();
            if (s) {
                var v = s.getVideoTracks()[0];
                if (v) {
                    v.enabled = !v.enabled;
                    this.classList.toggle('off', !v.enabled);
                }
            }
        });

        var sharing = false;
        document.getElementById('btnScreen').addEventListener('click', function () {
            var btn = this;
            if (!sharing) {
                ZoomyRTC.shareScreen().then(function () {
                    sharing = true;
                    btn.classList.add('active');
                }).catch(function () {});
            } else {
                ZoomyRTC.stopScreenShare().then(function () {
                    sharing = false;
                    btn.classList.remove('active');
                }).catch(function () {});
            }
        });

        function notifyLeave() {
            //  إزالة تواجد الطالب من العدّ عند المغادرة
            if (role === 'student' && offerId && token) {
                try {
                    fetch('/api/stream/leave/' + offerId, {
                        method: 'POST',
                        keepalive: true,
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                    }).catch(function () {});
                } catch (e) {}
            }
        }

        document.getElementById('btnLeave').addEventListener('click', function () {
            notifyLeave();
            try { ZoomyRTC.disconnect(); } catch (e) {}
            window.location.href = role === 'teacher' ? '/teacher-dashboard.html' : '/student-dashboard.html';
        });

        window.addEventListener('beforeunload', function () {
            notifyLeave();
            try { ZoomyRTC.disconnect(); } catch (e) {}
        });
    })();
    </script>
</body>
</html>
